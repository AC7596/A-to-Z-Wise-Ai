name = "a-to-z-wise-ai-diagnosis-backend"
main = "worker.mjs"
compatibility_date = "2026-09-16"

[vars]
# Set exactly to your public website origins (comma-separated).
# Include your GitHub Pages origin while testing.
# Example:
# ALLOWED_ORIGINS = "https://atozwiseai.com,https://www.atozwiseai.com,https://ac7596.github.io"
ALLOWED_ORIGINS = "https://atozwiseai.com,https://www.atozwiseai.com,https://ac7596.github.io"

# Optional provider configuration (safe to keep non-secret defaults in git).
AI_PROVIDER_MODEL = "gpt-4o-mini"
AI_PROVIDER_BASE_URL = "https://api.openai.com/v1"

# Required secret (set outside git):
# wrangler secret put AI_PROVIDER_API_KEY
